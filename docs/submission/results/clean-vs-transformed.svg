<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
<title>Clean versus transformed AUROC</title>
<desc>Persisted internal-validation robustness values and limitations.</desc>
<rect width="960" height="560" fill="#fff"/>
<text x="20" y="30" font-family="sans-serif" font-size="20" font-weight="bold">Clean versus transformed AUROC</text>
<text x="20" y="56" font-family="sans-serif" font-size="14">System: learned-static-fusion</text>
<text x="20" y="80" font-family="sans-serif" font-size="14">Mean transformed AUROC: 0.956751</text>
<text x="20" y="104" font-family="sans-serif" font-size="14">All-condition macro AUROC: 0.960354</text>
<text x="20" y="128" font-family="sans-serif" font-size="14">Worst condition: noise / sigma-0.1 (AUROC 0.810425)</text>
<line x1="170" y1="430" x2="770" y2="430" stroke="#243746"/>
<text x="160" y="163" text-anchor="end" font-family="sans-serif" font-size="14">clean</text>
<rect x="170" y="145" width="589.185" height="24" fill="#2563eb"/>
<text x="780" y="163" font-family="sans-serif" font-size="13">0.981975</text>
<text x="160" y="201" text-anchor="end" font-family="sans-serif" font-size="14">jpeg</text>
<rect x="170" y="183" width="579.308" height="24" fill="#2563eb"/>
<text x="780" y="201" font-family="sans-serif" font-size="13">0.965512</text>
<text x="160" y="239" text-anchor="end" font-family="sans-serif" font-size="14">blur</text>
<rect x="170" y="221" width="585.225" height="24" fill="#2563eb"/>
<text x="780" y="239" font-family="sans-serif" font-size="13">0.975375</text>
<text x="160" y="277" text-anchor="end" font-family="sans-serif" font-size="14">resize</text>
<rect x="170" y="259" width="577.418" height="24" fill="#2563eb"/>
<text x="780" y="277" font-family="sans-serif" font-size="13">0.962363</text>
<text x="160" y="315" text-anchor="end" font-family="sans-serif" font-size="14">noise</text>
<rect x="170" y="297" width="530.330" height="24" fill="#2563eb"/>
<text x="780" y="315" font-family="sans-serif" font-size="13">0.883883</text>
<text x="160" y="353" text-anchor="end" font-family="sans-serif" font-size="14">color</text>
<rect x="170" y="335" width="585.418" height="24" fill="#2563eb"/>
<text x="780" y="353" font-family="sans-serif" font-size="13">0.975696</text>
<text x="160" y="391" text-anchor="end" font-family="sans-serif" font-size="14">crop</text>
<rect x="170" y="373" width="586.605" height="24" fill="#2563eb"/>
<text x="780" y="391" font-family="sans-serif" font-size="13">0.977675</text>
<text x="20" y="458" font-family="sans-serif" font-size="14" font-weight="bold">Limitations</text>
<text x="20" y="482" font-family="sans-serif" font-size="11">Internal validation influenced candidate and threshold selection.</text>
<text x="20" y="504" font-family="sans-serif" font-size="11">These results are not organizer, sealed, official, independent-test, or unbiased estimates.</text>
<text x="20" y="526" font-family="sans-serif" font-size="11">Upstream checkpoint overlap cannot be disproven.</text>
<text x="20" y="548" font-family="sans-serif" font-size="11">The weakest-condition/FPR/FNR discussion is descriptive, not causal.</text>
</svg>
